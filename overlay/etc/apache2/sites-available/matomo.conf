ServerName localhost

<VirtualHost *:80>
    UseCanonicalName Off
    ServerAdmin webmaster@localhost
    DocumentRoot /usr/share/matomo/public
</VirtualHost>

<VirtualHost *:443>
    SSLEngine on
    ServerAdmin webmaster@localhost
    DocumentRoot /usr/share/matomo/public
</VirtualHost>

<Directory /usr/share/matomo/public/>
    Options +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<Directory /usr/share/matomo/README.md.gz>
    Require all denied
</Directory>
